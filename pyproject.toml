[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-pass-generator"
version = "1.0.0"
description = "Generate focused, personalized password wordlists for authorized security assessments."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Andrey Pautov", email = "1200km@gmail.com" }]
requires-python = ">=3.9"
keywords = ["pentesting", "password", "security", "wordlist", "red-team"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ppg = "PPG_personal_pass_generator:main"

[project.urls]
Homepage = "https://1200km.com/pt-tools.html"
Documentation = "https://medium.com/@1200km/personal-pass-generator-ppg-the-ultimate-tool-for-custom-password-lists-4979a3a1385c"
Repository = "https://github.com/anpa1200/personal-pass-generator"

[tool.setuptools]
py-modules = ["PPG_personal_pass_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
